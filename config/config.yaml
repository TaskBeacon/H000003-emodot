    NN_M_L_cue_onset: 192
    NN_M_L_target_onset: 193
    NN_M_R_cue_onset: 202
    NN_M_R_target_onset: 203

  driver:
    type: serial_url
    url: loop://
    baudrate: 115200
    timeout: 1
    prefix:
      - 1
      - 225
      - 1
      - 0

  policy:
    strict: false

  timing:
    post_delay_s: 0.001
